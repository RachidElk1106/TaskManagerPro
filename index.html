<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">✓</div>
          <h1>Task Manager</h1>
        </div>

        <div class="topbar-actions">
          <button id="add-task-btn" class="btn btn-primary" type="button">
            Add Task
          </button>
        </div>
      </header>

      <main class="dashboard">
        <section class="stats">
          <article class="stat-card" aria-label="Total tasks">
            <span class="stat-label">Total</span>
            <strong class="stat-value" id="stat-total">0</strong>
          </article>

          <article class="stat-card">
            <span class="stat-label">To Do</span>
            <strong class="stat-value" id="stat-todo">0</strong>
          </article>

          <article class="stat-card">
            <span class="stat-label">In Progress</span>
            <strong class="stat-value" id="stat-in-progress">0</strong>
          </article>

          <article class="stat-card">
            <span class="stat-label">In Review</span>
            <strong class="stat-value" id="stat-in-review">0</strong>
          </article>

          <article class="stat-card">
            <span class="stat-label">Done</span>
            <strong class="stat-value" id="stat-done">0</strong>
          </article>
        </section>

        <section class="controls" aria-label="Task controls">
          <div class="control-field">
            <label for="search-input">Search</label>
            <input
              id="search-input"
              type="search"
              name="search"
              placeholder="Find a task"
            />
          </div>

          <div class="control-field">
            <label for="status-filter">Status</label>
            <select id="status-filter" name="status-filter">
              <option value="all">All Statuses</option>
              <option value="todo">To Do</option>
              <option value="in-progress">In Progress</option>
              <option value="in-review">In Review</option>
              <option value="done">Done</option>
            </select>
          </div>

          <div class="control-field">
            <label for="priority-filter">Priority</label>
            <select id="priority-filter" name="priority-filter">
              <option value="all">All Priorities</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="control-field">
            <label for="sort-tasks">Sort</label>
            <select id="sort-tasks" name="sort-tasks">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="title-asc">Title A-Z</option>
              <option value="title-desc">Title Z-A</option>
              <option value="priority-asc">Priority ↑</option>
              <option value="priority-desc">Priority ↓</option>
              <option value="due-date">Due Date</option>
            </select>
          </div>
        </section>

        <section id="task-form-section" class="task-form-panel is-hidden" aria-label="Task form">
          <div class="panel-header">
            <h2 id="task-form-title">Add Task</h2>
          </div>

          <form id="task-form" novalidate>
            <div class="form-grid">
              <div class="field">
                <label for="task-title">Title</label>
                <input
                  id="task-title"
                  name="title"
                  type="text"
                  placeholder="Enter task title"
                />
              </div>

              <div class="field field-full">
                <label for="task-description">Description</label>
                <textarea
                  id="task-description"
                  name="description"
                  rows="4"
                  placeholder="Add task details"
                ></textarea>
              </div>

              <div class="field">
                <label for="task-status">Status</label>
                <select id="task-status" name="status">
                  <option value="todo">To Do</option>
                  <option value="in-progress">In Progress</option>
                  <option value="in-review">In Review</option>
                  <option value="done">Done</option>
                </select>
              </div>

              <div class="field">
                <label for="task-priority">Priority</label>
                <select id="task-priority" name="priority">
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                </select>
              </div>

              <div class="field">
                <label for="task-due-date">Due date</label>
                <input id="task-due-date" name="dueDate" type="date" />
              </div>
            </div>

            <div class="form-actions">
              <button id="task-form-submit" class="btn btn-primary" type="submit">
                Save Task
              </button>
              <button
                id="cancel-task-btn"
                class="btn btn-secondary"
                type="button"
              >
                Cancel
              </button>
            </div>
          </form>
        </section>

        <section class="task-list-section" aria-labelledby="tasks-heading">
          <div class="section-header">
            <h2 id="tasks-heading">Tasks</h2>
          </div>

          <div id="task-list" class="task-list" aria-live="polite">
            
          </div>
        </section>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
  
</html>
